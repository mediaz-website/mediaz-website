name: Mediazz Hub Daily SEO Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run lightweight SEO health, broken-link and schema monitoring
        env:
          SITE_URL: https://mediazhub.com
        run: node scripts/seo-monitor.mjs
      - name: Save daily monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediazzhub-daily-seo-health
          path: |
            seo-monitor-report.md
            seo-monitor-report.json
          if-no-files-found: warn
          retention-days: 14
