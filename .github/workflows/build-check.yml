name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/seo-sitemap-robots]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate automation script syntax
        run: |
          for file in scripts/*.mjs; do
            node --check "$file"
          done
      - name: Build website
        run: npm run build
