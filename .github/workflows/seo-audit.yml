name: Mediazz Hub SEO Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate automation script syntax
        run: |
          for file in scripts/*.mjs; do
            node --check "$file"
          done
      - name: Run technical SEO and Search Console audit
        env:
          SITE_URL: https://mediazhub.com
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/seo-audit.mjs
      - name: Run SEO health, broken-link, schema and indexing monitoring
        env:
          SITE_URL: https://mediazhub.com
        run: node scripts/seo-monitor.mjs
      - name: Run AEO readiness audit
        env:
          SITE_URL: https://mediazhub.com
        run: node scripts/aeo-readiness-audit.mjs
      - name: Generate Google Analytics 4 performance report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: node scripts/ga4-report.mjs
      - name: Generate grounded keyword and competitor research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: https://mediazhub.com
        run: node scripts/gemini-keyword-research.mjs
      - name: Generate Gemini SEO and AEO recommendations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/gemini-seo-recommendations.mjs
      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediazzhub-seo-audit
          path: |
            seo-audit-report.md
            seo-audit-report.json
            seo-monitor-report.md
            seo-monitor-report.json
            aeo-readiness-report.md
            aeo-readiness-report.json
            ga4-report.md
            ga4-report.json
            keyword-research-report.md
            keyword-research-report.json
            gemini-seo-recommendations.md
            gemini-seo-recommendations.json
          if-no-files-found: warn
          retention-days: 30
